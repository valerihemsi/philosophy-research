research_mathematical_frameworks:
  description: >
    Merkezi felsefi soru: Matematik, evreni açıklamak için insanlar tarafından
    icat edilmiş bir araç mıdır — yoksa evrenin içinde zaten var olan ve bizim
    yalnızca keşfettiğimiz bir yapı mıdır?

    Bu soruyu aşağıdaki eksenler üzerinden derinlemesine araştır:

    1. MATEMATİKSEL GERÇEKÇİLİK (Platonizm):
       Platon'un formlar teorisinden başlayarak Gödel'in "matematiksel sezgi"
       argümanına, G.H. Hardy'nin "A Mathematician's Apology"sindeki güzellik
       estetiğine ve Roger Penrose'un "The Emperor's New Mind"daki üç-dünya
       ontolojisine kadar incele. Bu görüşe göre pi sayısı, asal sayılar ve
       Mandelbrot kümesi evren var olmadan önce de "vardı" — biz onları
       keşfettik. Bu iddiayı destekleyen ve çürüten argümanları yan yana koy.

    2. WİGNER'IN AKILDIŞı ETKİNLİK PARADOKSU:
       Eugene Wigner'ın 1960 tarihli "The Unreasonable Effectiveness of
       Mathematics in the Natural Sciences" makalesini merkeze al.
       Soru şu: Neden saf matematikçilerin fiziksel gerçeklikle hiçbir ilişki
       kurmadan geliştirdiği yapılar — örneğin Riemann geometrisi, grup teorisi,
       matrisler — onlarca yıl sonra fiziğin tam kalbinde ortaya çıkıyor?
       Bu tesadüf mü, yoksa evrenin matematiksel yapısının kanıtı mı?
       Maxwell denklemleri, Schrödinger denklemi, Genel Görelilik örneklerini
       kullan.

    3. TEGMARK'IN MATEMATİKSEL EVREN HİPOTEZİ:
       Max Tegmark'ın "Our Mathematical Universe" (2014) tezini analiz et:
       Fiziksel evren yalnızca matematiği kullanmaz — fiziksel evrenin kendisi
       bir matematiksel yapıdır. Bu tezi savunan argümanları (Fiziksel
       varoluşun matematiksel varoluştan farkı nedir?) ve karşı argümanları
       (Qualia, bilinç, öznel deneyim bu tezde nerede?) eleştirel biçimde sun.

    4. ANTI-REALİST KARŞI CEPHE:
       a) Formalizm: Matematik anlamsız sembollerin tutarlı manipülasyonudur
          (Hilbert). Oyun kuralları gibi — kural dışında anlam yok.
       b) Sosyal Konstrüktivizm: Matematik insanların ürettiği kültürel bir
          pratiktir (Bloor, Ernest). Farklı medeniyetler farklı matematikler
          üretmiştir; bu çoğulculuk, evrensel gerçekliğe işaret etmez.
       c) Yapısal Nominalizm: Matematiksel nesneler yoktur; yalnızca yapılar
          arası ilişkiler vardır (Benacerraf, 1965 — "What Numbers Could Not Be").

    5. FİZİK-MATEMATİK GERİLİMİ:
       Matematiğin tüm fiziksel gerçekliği kapsayıp kapsamadığını sorgula:
       - Kuantum mekaniğinde gözlemcinin rolü matematiği kırıyor mu?
       - Gödel eksiklik teoremleri, evreni tam olarak tanımlayan bir matematiksel
         sistemin imkânsızlığını mı kanıtlıyor?
       - "Kötü matematik" diye bir şey var mı? Fizikte çalışmayan ama
         matematiksel olarak tutarlı olan yapılar ne anlama gelir?

    6. BİLİNÇ VE MATEMATİK:
       Eğer matematik keşfediliyorsa, kim ya da ne keşfediyor?
       Matematiksel gerçekliğe erişimi olan bir bilinç varsayımı ne anlama gelir?
       Penrose-Lucas argümanı (bilinç Gödel-tamamlanamaz, dolayısıyla hesaplanamaz)
       ve buna yapılan itirazları incele.

    Hangi pozisyona daha fazla ağırlık verdiğini ve neden verdiğini
    açıkça beyan et. Kesin yanıtı olmayan sorular için belirsizliği kabul et.
  expected_output: >
    En az 1000 kelimelik, bölümlere ayrılmış felsefi araştırma raporu.
    Şunları içermeli:
    - Her pozisyonun en güçlü argümanlarının dürüst sunumu
    - Wigner paradoksunun somut fizik örnekleriyle analizi
    - Tegmark tezi için ve aleyhine en az 3'er argüman
    - Araştırmacının kendi epistemik konumunun açık beyanı
    - Çözüme kavuşmamış gerilimler ve açık sorular listesi
    - Okuyucuya: "Bu soruyu neden önemsemelisiniz?" sorusunun yanıtı
  agent: math_framework_researcher
  output_file: research_report.md

bias_and_weight_analysis:
  description: >
    Birinci agentın "keşif mi icat mı" araştırmasını Adam Smith'in
    Tarafsız Gözlemci yöntemiyle analiz et.

    Bu araştırmanın kendine özgü bir tuzağı var: Her iki taraf da
    (Platonistler ve anti-realistler) kendi pozisyonunu doğrulayan kanıtlara
    seçici biçimde yönelme eğilimindedir. Tarafsız Gözlemci olarak şunu sor:

    1. ÇERÇEVE BİASI:
       Araştırmacı hangi pozisyona baştan eğilimli?
       Platonizm mi daha çok "doğruymuş gibi" sunuluyor,
       yoksa anti-realizm mi? Hangi argümanlar "güçlü",
       hangiler "naif" olarak nitelendiriliyor?

    2. WİGNER PARADOKSUNUN YÜKÜ:
       Wigner paradoksu gerçekten bir paradoks mu, yoksa bir retorik silah mı?
       Matematik-fizik uyumunun "akıl dışı" olduğu iddiası hangi
       varsayımlar üzerine kuruluyor? Bu uyumun sıradan açıklamaları
       (hayatta kalma biası: başarısız matematik modelleri unutulur,
       başarılılar hatırlanır) yeterince temsil ediliyor mu?

    3. TEGMARK TEZİNİN RETORİĞİ:
       Tegmark'ın "evren matematiktir" önermesi ampirik mi,
       yoksa metafizik mi? Araştırmacı bu ikisini birbirinden
       yeterince ayırt ediyor mu? "Matematiksel yapı" ve
       "fiziksel yapı" arasındaki farkın tanımlanamaması
       nasıl ele alınıyor?

    4. GÖDEL'İN ÇIFT KULLANIMI:
       Gödel'in eksiklik teoremleri, hem Platonistler
       ("bilinç Gödelci gerçeklere erişebilir, makine erişemez")
       hem de anti-realistler ("hiçbir sistem kendini tam
       açıklayamaz, dolayısıyla evrensel matematik imkânsız")
       tarafından kullanılmaktadır. Araştırmacı bu çift kullanımı
       fark ediyor mu ve hangisini seçiyor?

    5. DİL SORUNSALI:
       "Keşif" ve "icat" kavramları gerçekten birbirini dışlıyor mu?
       Araştırmacı bu dikotominin kendisini sorguluyor mu,
       yoksa verili olarak mı kabul ediyor?
       Wittgenstein'ın "dil oyunları" perspektifinden:
       Belki bu soru yanlış kurulmuş bir sorudur?

    6. BİLİNÇ ARGÜMANININ RİSKLERİ:
       Penrose-Lucas argümanı matematiksel Platonizmi desteklemek için
       kullanıldığında hangi gizli varsayımları devreye sokuyor?
       (Bilinç = hesaplanamaz süreç varsayımı kanıtlanmış mı?)

    Her bias için: doğrudan alıntı + Tarafsız Gözlemci yorumu.
    Araştırmacının en güçlü kör noktasını tek paragrafta özetle.
    Son olarak: Bu soru yanıtlanabilir mi? Yanıtlanabilirlik koşulları nedir?
  expected_output: >
    En az 700 kelimelik bias analizi:
    - Her bias başlığı altında alıntı + analiz
    - Wigner paradoksunun alternatif (naturaliste) açıklamalarının
      temsil edilip edilmediğinin değerlendirmesi
    - "Keşif/icat" dikotomisinin kendisine yönelik eleştiri
    - Araştırmacının en büyük kör noktası (tek paragraf)
    - Tarafsız Gözlemci'nin nihai sorusu:
      Bu araştırma "matematik nedir?" sorusunu mu,
      yoksa "matematik ne olmasını istiyoruz?" sorusunu mu yanıtlıyor?
  agent: impartial_spectator
  output_file: bias_analysis.md
  context:
    - research_mathematical_frameworks

four_quadrants_synthesis:
  description: >
    Ken Wilber'ın Dört Kadran modelini (AQAL) kullanarak hem araştırma
    raporunu hem de bias analizini entegre bir senteze kavuştur.

    Dört Kadranı matematiğe şöyle uygula:

    ÜST-SOL KADRAN (Ben / İç-Bireysel / "I"):
    Matematiksel deneyimin fenomenolojisi. Bir matematikçi
    bir ispatı "görürken" içsel olarak ne yaşıyor?
    Poincaré'nin yaratıcı sezgi anlatıları, Hardy'nin
    estetik deneyimi, Ramanujan'ın "tanrısal dikte" metaforu.
    Bilinç ve matematiksel sezgi: Bu kadrana göre Platonizm
    ile Wigner paradoksu nasıl görünür? İçsel deneyimden
    bakan biri için matematik keşfediliyor mu icat mı ediliyor?

    ÜST-SAĞ KADRAN (O / Dış-Bireysel / "It"):
    Matematiğin nörobiyolojisi ve davranışsal boyutu.
    Beyin görüntüleme çalışmaları: matematiksel düşünce
    sırasında hangi bölgeler aktif? Sayı sezgisi (number sense)
    evrimsel mi? Stanislas Dehaene'nin çalışmaları.
    Fiziğin matematiksel yasaları bu kadranda: Maxwell,
    Schrödinger, Einstein denklemleri dışsal-nesnel gerçeklik
    olarak. Wigner paradoksu bu kadranın içinden nasıl görünür?

    ALT-SOL KADRAN (Biz / İç-Kolektif / "We"):
    Matematiksel kültür, paylaşılan anlam dünyaları,
    matematiksel toplulukların epistemik normları.
    "Güzel kanıt" nedir? Bu estetik yargı kültürel mi?
    Farklı matematiksel geleneklerin (Batı, Hint, İslam, Çin)
    farklı "matematiksel gerçek" anlayışları. Sosyal
    konstrüktivizm tam olarak bu kadranda yaşar.
    Bias analizindeki kültürel temsil sorunu buraya aittir.
    Bu kadran için: Matematik topluluklar arası "Biz" olmadan
    var olabilir mi?

    ALT-SAĞ KADRAN (Onlar / Dış-Kolektif / "Its"):
    Matematiksel kurumlar, ekonomik sistemler, teknolojik
    altyapı. Üniversiteler, yayın sistemleri, araştırma
    finansmanı, patent hukuku. Matematiğin kapitalist
    üretim süreçleriyle ilişkisi — algoritma ekonomisi,
    kriptografi, finans mühendisliği. Bias analizindeki
    kurumsal eşitsizlikler tam olarak bu kadranda.

    SENTEZ GÖREVİ:
    a) "Keşif mi icat mı?" sorusunu dört kadranın ışığında
       yeniden çerçevele. Her kadran bu soruya farklı bir
       yanıt veriyor mu? Hangi kadran hangi pozisyona
       (Platonizm, formalizm, konstrüktivizm) doğal ev sahipliği yapıyor?

    b) Araştırmacı ve Tarafsız Gözlemci'nin hangi kadranı
       görmezden geldiğini tespit et.

    c) Wilber'ın "Flatland" eleştirisi bu tartışmaya nasıl uygulanır?
       (Flatland = gerçekliği yalnızca Üst-Sağ + Alt-Sağ kadranlarına
       indirgemek — tüm içsel ve kültürel boyutları paranteze almak)

    d) Entegral bir yanıt taslağı öner: Matematik hem keşfedilir
       hem icat edilir — ama hangi kadran hangi yanıtı verir?
       Bu "hem/hem de" yanıtı sahte bir uzlaşı mı, yoksa
       gerçek bir entegrasyon mu? Farkı açıkla.
  expected_output: >
    En az 800 kelimelik entegral sentez raporu:
    - Her kadran için ayrı bölüm: matematikle ilişkisi + araştırmadan somut bağlantı
    - Dört Kadran tablosu: hangi filozofun/pozisyonun hangi kadranda yaşadığı
    - "Keşif mi icat mı?" sorusunun dört kadran üzerinden yeniden çerçevelenmesi
    - Araştırma + bias analizinin hangi kadranları ihmal ettiği
    - Entegral yanıt taslağı: sahte uzlaşıyı gerçek entegrasyondan ayıran kriter
    - Kapanış: Bu soruyu sormaya devam etmenin neden önemli olduğu
  agent: integral_synthesizer
  output_file: integral_synthesis.md
  context:
    - research_mathematical_frameworks
    - bias_and_weight_analysis
